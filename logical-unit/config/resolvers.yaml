playbooks:
  heavy_rain:
    category: roof
    expert:  # example, not a registered partner
      profession: Roofer
      example_name: Example Roofing Ltd
      reason: Gutter cleaning and roof penetration check
      price_min_eur: 150
      price_max_eur: 400
      price_basis: Gutter and downspout cleaning plus roof check, 2–4 h
    actions:
      - Clean the gutters and downspouts before the rain
      - Make sure rainwater drains away from the foundation
      - After the rain, check the attic and roof penetrations for moisture
  extreme_rain:
    category: moisture
    expert:  # example, not a registered partner
      profession: Drainage and flood protection specialist
      example_name: Example Drainage Services Ltd
      reason: Drainage wells and flood pump need checking before heavy rain
      price_min_eur: 300
      price_max_eur: 1200
      price_basis: Drainage well inspection, pump check or rental
    actions:
      - Move valuables from the basement and ground-level rooms to higher floors
      - Check the drainage wells and that the flood pump (if any) works
      - Order on-call flood protection if needed
  rain_accumulation:
    category: moisture
    expert:  # example, not a registered partner
      profession: Drainage specialist
      example_name: Example Drainage Services Ltd
      reason: Drains must cope with several days of rain
      price_min_eur: 200
      price_max_eur: 600
      price_basis: Drain inspection and flushing
    actions:
      - Check that the drains and stormwater wells flow freely
      - Monitor moisture in the basement and base floor after the rains
  storm_forecast:
    category: roof
    expert:  # example, not a registered partner
      profession: Roofer
      example_name: Example Roofing Ltd
      reason: Roof sheets and flashings may come loose in strong wind
      price_min_eur: 200
      price_max_eur: 600
      price_basis: Inspection of roof fastenings and minor tightening
    actions:
      - Secure or bring indoors loose items (garden furniture, trampoline)
      - Check the fastenings of roof sheets, chimney flashings and antennas
      - Assess the condition of yard trees and their risk of falling
  storm_wind:
    category: roof
    expert:  # example, not a registered partner
      profession: Roofer
      example_name: Example Roofing Ltd
      reason: Storm damage to the roof and gutters
      price_min_eur: 200
      price_max_eur: 800
      price_basis: Post-storm roof inspection and small repairs
    actions:
      - Secure loose items and close windows and ventilation hatches
      - After the storm, check the roof, gutters and yard trees
  severe_storm:
    category: roof
    expert:  # example, not a registered partner
      profession: On-call roofer
      example_name: Example Emergency Roofing Ltd
      reason: Severe storm may damage the roofing and let water in
      price_min_eur: 500
      price_max_eur: 3000
      price_basis: Emergency tarp and temporary repair, incl. after-hours surcharge
    actions:
      - Stay indoors and keep away from trees
      - After the storm, photograph any damage for insurance
      - Order an on-call roofer if the roofing is damaged
  frost_forecast:
    category: plumbing
    expert:  # example, not a registered partner
      profession: Plumber
      example_name: Example Plumbing Ltd
      reason: Outdoor taps and unprotected pipes may freeze
      price_min_eur: 100
      price_max_eur: 300
      price_basis: Shutting off and draining outdoor taps, heating check
    actions:
      - Drain and shut off outdoor taps and irrigation systems
      - Make sure the heating works and that no water pipes in cold spaces are unprotected
  hard_frost:
    category: plumbing
    expert:  # example, not a registered partner
      profession: On-call plumber
      example_name: Example Plumbing Ltd
      reason: Hard frost can freeze and burst water pipes
      price_min_eur: 300
      price_max_eur: 1500
      price_basis: Thawing frozen pipes or installing heating cables
    actions:
      - Make sure the heating works in all spaces, including the basement and crawl space
      - Insulate or heat pipes at risk of freezing (heating cables)
      - If no water comes from the tap, close the main valve and call a plumber
  flood_warning:
    category: moisture
    expert:  # example, not a registered partner
      profession: Flood protection specialist
      example_name: Example Flood Protection Ltd
      reason: Basement and ground-level rooms are at risk of flooding
      price_min_eur: 300
      price_max_eur: 1000
      price_basis: Drainage and pump check, flood barrier preparation
    actions:
      - Move valuables from the basement and ground-level rooms to higher floors
      - Check the drainage wells, stormwater wells and that the flood pump works
      - Follow the authorities' flood bulletins
  flood_severe:
    category: moisture
    expert:  # example, not a registered partner
      profession: On-call flood protection specialist
      example_name: Example Flood Protection Ltd
      reason: Severe flood risk to the basement and foundation
      price_min_eur: 800
      price_max_eur: 4000
      price_basis: Sandbags or barriers, pumping, on-call surcharge
    actions:
      - Protect basement doors and windows with sandbags or flood barriers
      - Cut the power to rooms where water may rise
      - Order on-call flood protection and follow the rescue authorities' instructions
  forest_fire_warning:
    category: fire
    expert:  # example, not a registered partner
      profession: Fire safety inspector
      example_name: Example Fire Safety Ltd
      reason: Dry debris near the building increases fire risk
      price_min_eur: 150
      price_max_eur: 400
      price_basis: Fire safety walkthrough and debris removal from roof and gutters
    actions:
      - Do not light open fires, barbecue or burn brushwood
      - Remove dry leaves and twigs from the roof, gutters and along the walls
      - Make sure the garden hose reaches all around the building
  forest_fire_severe:
    category: fire
    expert:  # example, not a registered partner
      profession: Fire safety contractor
      example_name: Example Fire Safety Ltd
      reason: Wildfire may spread to the property
      price_min_eur: 500
      price_max_eur: 2000
      price_basis: Sprinkler or perimeter wetting setup
    actions:
      - Follow the rescue authorities' bulletins and prepare to evacuate
      - Close windows, vents and ventilation in case of smoke
      - Water the area around the building if it is safe to do so
  freezing_pipes_warning:
    category: plumbing
    expert:  # example, not a registered partner
      profession: Plumber
      example_name: Example Plumbing Ltd
      reason: Water pipes in cold spaces may freeze
      price_min_eur: 150
      price_max_eur: 500
      price_basis: Pipe insulation check and heating cable inspection
    actions:
      - Keep the heating on in all spaces, including the basement and crawl space
      - Insulate pipes in cold spaces or install heating cables
      - Leave a tap dripping slightly in the coldest part of the house
  freezing_pipes_severe:
    category: plumbing
    expert:  # example, not a registered partner
      profession: On-call plumber
      example_name: Example Plumbing Ltd
      reason: Hard frost can freeze and burst water pipes
      price_min_eur: 300
      price_max_eur: 1500
      price_basis: Thawing frozen pipes or emergency repair, incl. on-call surcharge
    actions:
      - Check that water comes from every tap; if not, close the main valve
      - Do not thaw pipes with an open flame
      - Call an on-call plumber if a pipe has frozen or leaks
  frostbite_warning:
    category: plumbing
    expert:  # example, not a registered partner
      profession: Heating technician
      example_name: Example Heating Services Ltd
      reason: The heating system must cope with severe cold
      price_min_eur: 100
      price_max_eur: 400
      price_basis: Heating system check and adjustment
    actions:
      - Limit time outdoors and dress in layers, covering face and hands
      - Make sure the heating works and keep doors and windows closed
      - Check on elderly neighbours and bring pets indoors
  frostbite_severe:
    category: plumbing
    expert:  # example, not a registered partner
      profession: On-call heating technician
      example_name: Example Heating Services Ltd
      reason: A heating failure in extreme cold is dangerous
      price_min_eur: 300
      price_max_eur: 1200
      price_basis: Emergency heating repair, incl. on-call surcharge
    actions:
      - Avoid going outdoors; exposed skin can freeze within minutes
      - Make sure the heating works and have a backup heat source ready
      - Call an on-call heating technician immediately if the heating fails
  no_data:
    category: automation
    expert:  # example, not a registered partner
      profession: Building automation technician
      example_name: Example Automation Services Ltd
      reason: Data from the property has stopped
      price_min_eur: 100
      price_max_eur: 300
      price_basis: Remote diagnostics or a site visit to check the connection
    actions:
      - Check the Data Consolidator status (GET /app/data_events)
      - Check whether there are weather events within 25 km of the property
