playbooks:
  heavy_rain:
    category: katto
    actions:
      - Puhdista rännit ja syöksytorvet ennen sadetta
      - Varmista, että sadevesi ohjautuu poispäin sokkelista
      - Tarkista sateen jälkeen ullakko ja katon läpiviennit kosteuden varalta
  extreme_rain:
    category: kosteus
    actions:
      - Siirrä kellarista ja maanvaraisista tiloista arvotavarat ylemmäs
      - Tarkista salaojakaivot ja mahdollisen tulvapumpun toiminta
      - Tilaa tarvittaessa päivystävä tulvasuojaus
  rain_accumulation:
    category: kosteus
    actions:
      - Tarkista salaojien ja sadevesikaivojen vetävyys
      - Seuraa kellarin ja alapohjan kosteutta sateiden jälkeen
  storm_forecast:
    category: katto
    actions:
      - Kiinnitä tai siirrä sisälle irtotavarat (pihakalusteet, trampoliini)
      - Tarkista kattopeltien, piipun pellitysten ja antennien kiinnitykset
      - Arvioi pihapuiden kunto ja kaatumisriski
  storm_wind:
    category: katto
    actions:
      - Kiinnitä irtotavarat ja sulje ikkunat sekä ilmanvaihtoluukut
      - Tarkista myrskyn jälkeen katto, rännit ja pihapuut
  severe_storm:
    category: katto
    actions:
      - Pysy sisällä ja vältä puiden läheisyyttä
      - Myrskyn jälkeen dokumentoi vahingot valokuvin vakuutusta varten
      - Tilaa päivystävä kattohuolto, jos katteessa on vaurioita
  frost_forecast:
    category: lvi
    actions:
      - Tyhjennä ja sulje ulkohanat ja kastelujärjestelmät
      - Varmista lämmityksen toiminta ja ettei kylmissä tiloissa ole vesiputkia ilman suojausta
  hard_frost:
    category: lvi
    actions:
      - Varmista, että lämmitys toimii kaikissa tiloissa, myös kellarissa ja ryömintätilassa
      - Suojaa tai lämmitä jäätymiselle alttiit putket (lämmityskaapelit)
      - Jos vesi ei tule hanasta, sulje pääsulku ja tilaa LVI-asentaja
  no_data:
    category: automaatio
    actions:
      - Tarkista Data Consolidatorin tila (GET /app/data_events)
      - Tarkista, onko kohteen 25 km säteellä säätapahtumia
