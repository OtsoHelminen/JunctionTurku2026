playbooks:
  pressure_low:
    category: putki
    actions:
      - Tarkista, onko alueella vesilaitoksen ilmoittamia katkoja tai korjaustöitä
      - Tarkista paineenalennusventtiili ja suodattimet
      - Jos paine jatkaa laskuaan, tilaa putkiasentaja
  pressure_critical:
    category: putki
    actions:
      - Tarkista välittömästi näkyvät vuodot ja sulje tarvittaessa pääsulku
      - Tilaa päivystävä putkiasentaja
  pressure_drop:
    category: putki
    actions:
      - Vertaa virtausdataan; samanaikainen virtaus viittaa vuotoon
      - Tarkista tekniset tilat ja runkolinja
  continuous_flow:
    category: putki
    actions:
      - Tarkista vuotavat hanat, WC-istuimet ja varaajan varoventtiili
      - Jos syy ei löydy, tilaa vuodonetsintä
  freezing_risk:
    category: lvi
    actions:
      - Tarkista lämmityksen toiminta ja ovien sekä ikkunoiden sulkeutuminen
      - Suojaa jäätymiselle alttiit putket
  high_humidity:
    category: kosteus
    actions:
      - Tarkista ilmanvaihdon toiminta
      - Tarkista mahdolliset vesivuodot ja tilaa tarvittaessa kosteuskartoitus
  pressure_sensor_flatline:
    category: automaatio
    actions:
      - Tarkista anturin kytkennät ja tiedonsiirto
      - Vertaa paikalliseen painemittariin
  no_data:
    category: automaatio
    actions:
      - Tarkista kohteen tiedonsiirtoyhteys ja Data Consolidatorin tila
