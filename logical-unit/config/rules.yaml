# Hälytyssäännöt. Nämä päättävät, syntyykö hälytys. Kielimalli EI päätä sitä.
#
# Data tulee Data Consolidatorilta (app/consolidator.py). Jokaisesta kohteesta tallennetaan
# minuutin välein lähialueen uusimman sääennusteen arvot:
#   rain_today_mm            tämän päivän sademäärä
#   wind_today_m_s           tämän päivän tuulen nopeus
#   temp_min_today_c         tämän päivän alin lämpötila
#   temp_max_today_c         tämän päivän ylin lämpötila
#   rain_forecast_total_mm   sademäärä yhteensä koko ennusteen ajalta (yleensä 3 vrk)
#   wind_forecast_max_m_s    kovin tuuli koko ennusteen aikana
#   temp_forecast_min_c      alin lämpötila koko ennusteen aikana
#
# Yhteiset kentät:
#   id         yksilöllinen tunniste (pelikirjat viittaavat tähän)
#   type       threshold | change | sustained | flatline | missing_data
#   metric     mittarin nimi (yllä; ei missing_data-säännöissä)
#   severity   info | low | medium | high | critical
#   message    teksti; käytettävissä {source_id}, {value} ja säännön details-kentät
#   category   ratkaisijakategoria (katto, kosteus, lvi, automaatio)
#   group      saman ryhmän säännöt = yksi hälytys, vakavin voittaa (-> eskalointi)
#   immediate  true = arvioidaan joka minuutti, ei odoteta tasatuntia
#   sources    valinnainen lista source_id:itä, joita sääntö koskee (oletus: kaikki)
#
# Tyyppikohtaiset parametrit:
#   threshold:    op (< <= > >=), value, aggregate (avg|min|max|last), window_minutes, min_points
#   change:       pct (positiivinen), direction (down|up|any), window_minutes, compare_minutes
#   sustained:    op, value, window_minutes, min_coverage (0–1), interval_seconds
#   flatline:     window_minutes, min_points, tolerance
#   missing_data: max_gap_minutes
#
# HUOM: raja-arvot ovat esimerkkejä (Ilmatieteen laitoksen varoitusrajojen tapaisia).
# Sovi lopulliset arvot asiantuntijan kanssa.

rules:
  # --- Sade: rankkasade (high) eskaloituu erittäin rankaksi (critical)
  - id: heavy_rain
    group: rain
    type: threshold
    metric: rain_today_mm
    op: ">="
    value: 10
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: high
    category: katto
    message: "Rankkasade kohteessa {source_id}: ennuste {value} mm tänään (raja {threshold} mm)"

  - id: extreme_rain
    group: rain
    type: threshold
    metric: rain_today_mm
    op: ">="
    value: 25
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: kosteus
    message: "Erittäin rankka sade kohteessa {source_id}: ennuste {value} mm tänään, tulvariski"

  # --- Sateen kertymä lähipäivinä: salaojat ja perustukset
  - id: rain_accumulation
    type: threshold
    metric: rain_forecast_total_mm
    op: ">="
    value: 30
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: kosteus
    message: "Lähipäivien sademäärä kohteessa {source_id} yhteensä {value} mm (raja {threshold} mm)"

  # --- Tuuli: tuleva myrsky (medium) -> myrsky tänään (high) -> kova myrsky (critical)
  - id: storm_forecast
    group: wind
    type: threshold
    metric: wind_forecast_max_m_s
    op: ">="
    value: 15
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: katto
    message: "Myrsky ennusteessa kohteelle {source_id}: tuulta jopa {value} m/s lähipäivinä"

  - id: storm_wind
    group: wind
    type: threshold
    metric: wind_today_m_s
    op: ">="
    value: 15
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: high
    category: katto
    message: "Myrsky kohteessa {source_id} tänään: tuuli {value} m/s (raja {threshold} m/s)"

  - id: severe_storm
    group: wind
    type: threshold
    metric: wind_today_m_s
    op: ">="
    value: 21
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: katto
    message: "Kova myrsky kohteessa {source_id}: tuuli {value} m/s"

  # --- Pakkanen: jäätymisriski (medium) -> kova pakkanen (high)
  - id: frost_forecast
    group: frost
    type: threshold
    metric: temp_forecast_min_c
    op: "<="
    value: 0
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: lvi
    message: "Pakkasta ennusteessa kohteelle {source_id}: alimmillaan {value} °C"

  - id: hard_frost
    group: frost
    type: threshold
    metric: temp_min_today_c
    op: "<="
    value: -15
    aggregate: min
    window_minutes: 15
    min_points: 3
    severity: high
    category: lvi
    message: "Kova pakkanen kohteessa {source_id} tänään: {value} °C, putkien jäätymisriski"

  # --- Data lakannut tulemasta (Data Consolidator alhaalla tai ei tapahtumia lähialueelta)
  - id: no_data
    type: missing_data
    max_gap_minutes: 10
    severity: high
    immediate: true
    category: automaatio
    message: "Kohteesta {source_id} ei ole saatu säädataa {gap_minutes} minuuttiin"
