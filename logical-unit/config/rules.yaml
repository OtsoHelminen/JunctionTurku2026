# Alert rules. These decide whether an alert is raised. The language model does NOT decide that.
#
# Data comes from the Data Consolidator (app/consolidator.py). For every house the forecast values
# of the surrounding area are stored once a minute:
#   rain_today_mm            rainfall today
#   wind_today_m_s           wind speed today
#   temp_min_today_c         lowest temperature today
#   temp_max_today_c         highest temperature today
#   rain_forecast_total_mm   total rainfall over the whole forecast (usually 3 days)
#   wind_forecast_max_m_s    strongest wind over the whole forecast
#   temp_forecast_min_c      lowest temperature over the whole forecast
#   flood_level              consolidator flood warning: 0 none, 1 warning, 2 severe
#   forest_fire_level        consolidator wildfire warning: 0 none, 1 warning, 2 severe
#
# Common fields:
#   id         unique identifier (playbooks refer to this)
#   type       threshold | change | sustained | flatline | missing_data
#   metric     metric name (above; not used in missing_data rules)
#   severity   info | low | medium | high | critical
#   message    text; {source_id}, {value} and the rule's details fields are available
#   category   resolver category (roof, moisture, plumbing, fire, automation)
#   group      rules in the same group = one alert, the most severe wins (-> escalation)
#   immediate  true = evaluated every minute instead of waiting for the full hour
#   sources    optional list of source_ids the rule applies to (default: all)
#
# Type-specific parameters:
#   threshold:    op (< <= > >=), value, aggregate (avg|min|max|last), window_minutes, min_points
#   change:       pct (positive), direction (down|up|any), window_minutes, compare_minutes
#   sustained:    op, value, window_minutes, min_coverage (0–1), interval_seconds
#   flatline:     window_minutes, min_points, tolerance
#   missing_data: max_gap_minutes
#
# NOTE: the thresholds are examples (similar to the Finnish Meteorological Institute's warning limits).
# Agree on the final values with an expert.

rules:
  # --- Rain: heavy rain (high) escalates to very heavy rain (critical)
  - id: heavy_rain
    group: rain
    type: threshold
    metric: rain_today_mm
    op: ">="
    value: 10
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: high
    category: roof
    message: "Heavy rain at {source_id}: {value} mm forecast today (limit {threshold} mm)"

  - id: extreme_rain
    group: rain
    type: threshold
    metric: rain_today_mm
    op: ">="
    value: 25
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: moisture
    message: "Very heavy rain at {source_id}: {value} mm forecast today, flood risk"

  # --- Rain accumulating over the coming days: drains and foundations
  - id: rain_accumulation
    type: threshold
    metric: rain_forecast_total_mm
    op: ">="
    value: 30
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: moisture
    message: "Rain over the coming days at {source_id} totals {value} mm (limit {threshold} mm)"

  # --- Wind: storm ahead (medium) -> storm today (high) -> severe storm (critical)
  - id: storm_forecast
    group: wind
    type: threshold
    metric: wind_forecast_max_m_s
    op: ">="
    value: 15
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: roof
    message: "Storm in the forecast for {source_id}: wind up to {value} m/s in the coming days"

  - id: storm_wind
    group: wind
    type: threshold
    metric: wind_today_m_s
    op: ">="
    value: 15
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: high
    category: roof
    message: "Storm at {source_id} today: wind {value} m/s (limit {threshold} m/s)"

  - id: severe_storm
    group: wind
    type: threshold
    metric: wind_today_m_s
    op: ">="
    value: 21
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: roof
    message: "Severe storm at {source_id}: wind {value} m/s"

  # --- Frost: freezing risk (medium) -> hard frost (high)
  - id: frost_forecast
    group: frost
    type: threshold
    metric: temp_forecast_min_c
    op: "<="
    value: 0
    aggregate: avg
    window_minutes: 15
    min_points: 3
    severity: medium
    category: plumbing
    message: "Frost in the forecast for {source_id}: down to {value} °C"

  - id: hard_frost
    group: frost
    type: threshold
    metric: temp_min_today_c
    op: "<="
    value: -15
    aggregate: min
    window_minutes: 15
    min_points: 3
    severity: high
    category: plumbing
    message: "Hard frost at {source_id} today: {value} °C, risk of frozen pipes"

  # --- Consolidator zone warnings (the consolidator handles hysteresis, so last + immediate)
  - id: flood_warning
    group: flood
    type: threshold
    metric: flood_level
    op: ">="
    value: 1
    aggregate: last
    window_minutes: 5
    severity: high
    immediate: true
    category: moisture
    message: "Flood warning in the area of {source_id}"

  - id: flood_severe
    group: flood
    type: threshold
    metric: flood_level
    op: ">="
    value: 2
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: moisture
    message: "Severe flood warning in the area of {source_id}"

  - id: forest_fire_warning
    group: forest_fire
    type: threshold
    metric: forest_fire_level
    op: ">="
    value: 1
    aggregate: last
    window_minutes: 5
    severity: high
    immediate: true
    category: fire
    message: "Wildfire warning in the area of {source_id}"

  - id: forest_fire_severe
    group: forest_fire
    type: threshold
    metric: forest_fire_level
    op: ">="
    value: 2
    aggregate: last
    window_minutes: 5
    severity: critical
    immediate: true
    category: fire
    message: "Severe wildfire warning in the area of {source_id}"

  # --- Data stopped arriving (Data Consolidator down or no events nearby)
  - id: no_data
    type: missing_data
    max_gap_minutes: 10
    severity: high
    immediate: true
    category: automation
    message: "No weather data received from {source_id} for {gap_minutes} minutes"
